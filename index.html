<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar</title>
    <link rel="stylesheet" href="search_bar.css">
</head>
<body>
    <div class="container">
        <img class="icon" src="https://icon-library.com/images/search-icon-free/search-icon-free-12.jpg" alt="image of search icon" style="width: 32px; height: 24px;">
        <input type="search" class="searchbox" name="search" placeholder="Enter text here...">
        <input type="submit" value="Search" class="searchButton" onclick="searchGoogle()">
    </div>

    <script>
        function searchGoogle() {
            var query = document.querySelector('.searchbox').value;
            var googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            window.location.href = googleUrl;
        }
    </script>
</body>
</html>
